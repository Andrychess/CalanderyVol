<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#2669B8">
    <meta name="color-scheme" content="light dark">
    <title>Мероприятия</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@vkontakte/vk-bridge@2/dist/browser.min.js"></script>
    <script src="config.js"></script>
    <script src="js/vk-theme.js"></script>
</head>
<body class="app-shell">
    <div class="app-header">
        <h1>Мероприятия</h1>
        <p class="subtitle" id="appSubtitle">Загрузка...</p>
    </div>

    <div class="view-switch" role="tablist" aria-label="Режим просмотра">
        <button type="button" class="view-switch-btn active" data-view="list" role="tab" aria-selected="true">Список</button>
        <button type="button" class="view-switch-btn" data-view="calendar" role="tab" aria-selected="false">Календарь</button>
    </div>

    <div class="toolbar">
        <input type="search" id="searchInput" class="search-input" placeholder="Поиск по названию..." autocomplete="off">

        <div class="filter-row">
            <button type="button" class="filter-chip active" data-level="all">Все</button>
            <button type="button" class="filter-chip" data-level="вузовский">Вузовский</button>
            <button type="button" class="filter-chip" data-level="городской">Городской</button>
            <button type="button" class="filter-chip" data-level="региональный">Региональный</button>
            <button type="button" class="filter-chip" data-level="межрегиональный">Межрегиональный</button>
            <button type="button" class="filter-chip" data-level="всероссийский">Всероссийский</button>
            <button type="button" class="filter-chip" data-level="международный">Международный</button>
        </div>

        <div class="filter-actions">
            <button type="button" class="toggle-btn" id="favoritesFilterBtn">Избранное</button>
            <button type="button" class="toggle-btn hidden" id="pastEventsFilterBtn">Прошедшие мероприятия</button>
        </div>
    </div>

    <div id="adminToolbar" class="admin-toolbar hidden">
        <button type="button" class="add-event-btn" id="addEventBtn">Добавить мероприятие</button>
        <button type="button" class="delete-past-btn hidden" id="deleteAllPastBtn">Удалить все прошедшие мероприятия</button>
    </div>

    <div id="listView">
        <div id="eventsContainer" class="events-list">
            <div class="loading">Загрузка мероприятий...</div>
        </div>
    </div>

    <div id="calendarView" class="calendar-view hidden" aria-hidden="true">
        <div id="calendarContainer">
            <div class="loading">Загрузка календаря...</div>
        </div>
    </div>

    <div id="eventViewModal" class="modal" aria-hidden="true">
        <div class="modal-content event-view-modal">
            <button type="button" class="close" id="eventViewClose" aria-label="Закрыть">&times;</button>
            <div id="eventViewBody"></div>
        </div>
    </div>

    <div id="scheduleModal" class="modal schedule-modal" aria-hidden="true">
        <div class="modal-content schedule-modal-content">
            <div class="schedule-modal__header">
                <div class="schedule-modal__titles">
                    <h2 id="scheduleModalTitle">Расписание</h2>
                    <p id="scheduleModalSubtitle" class="schedule-modal__subtitle"></p>
                </div>
                <button type="button" class="close" id="scheduleClose" aria-label="Закрыть">&times;</button>
            </div>

            <div class="schedule-tabs" role="tablist" aria-label="Разделы расписания">
                <button type="button" class="schedule-tab active" data-tab="regulations" role="tab" aria-selected="true">Регламент мероприятия</button>
                <button type="button" class="schedule-tab" data-tab="volunteer" role="tab" aria-selected="false">Волонтерская смена</button>
            </div>

            <div id="schedulePanel" class="schedule-panel"></div>

            <div id="scheduleAdminBar" class="schedule-admin-bar hidden">
                <button type="button" class="secondary-btn" id="scheduleSaveBtn">Сохранить</button>
                <button type="button" class="submit-btn" id="schedulePublishBtn">Опубликовать расписание</button>
            </div>
        </div>
    </div>

    <div id="eventModal" class="modal" aria-hidden="true">
        <div class="modal-content">
            <button type="button" class="close" id="modalClose" aria-label="Закрыть">&times;</button>
            <h2 id="modalTitle">Новое мероприятие</h2>
            <form id="eventForm">
                <input type="hidden" id="eventId">
                <label class="field-label">Название события *</label>
                <input type="text" id="eventTitle" required maxlength="200">

                <label class="field-label">Даты и время проведения *</label>
                <div id="schedulesList" class="schedules-list"></div>
                <button type="button" class="schedules-add-btn" id="addScheduleBtn">+ Добавить дату</button>
                <p class="field-hint">Можно указать несколько дней. Если все даты прошли, карточка видна только в «Прошедшие мероприятия».</p>

                <label class="field-label">Локация</label>
                <input type="text" id="eventLocation" value="ЮРГПУ(НПИ)" maxlength="200">

                <label class="field-label">Уровень *</label>
                <select id="eventLevel" required>
                    <option value="вузовский">Вузовский</option>
                    <option value="городской">Городской</option>
                    <option value="региональный" selected>Региональный</option>
                    <option value="межрегиональный">Межрегиональный</option>
                    <option value="всероссийский">Всероссийский</option>
                    <option value="международный">Международный</option>
                </select>

                <label class="field-label">Набор участников *</label>
                <select id="eventEnrollment" required>
                    <option value="open" selected>Набор открыт</option>
                    <option value="closed">Набор закрыт</option>
                </select>

                <label class="field-label">Функционал</label>
                <textarea id="eventFunctionality" rows="3" placeholder="Задачи и роли участников"></textarea>

                <label class="field-label">Условия</label>
                <textarea id="eventConditions" rows="2" placeholder="Условия участия"></textarea>

                <label class="field-label">Краткое описание</label>
                <textarea id="eventDescription" rows="3" placeholder="Кратко о мероприятии"></textarea>

                <label class="field-label">Текст кнопки</label>
                <input type="text" id="eventButtonLabel" value="Подтвердить участие (перейти в информационный чат)" maxlength="100">

                <label class="field-label">Ссылка или чат VK *</label>
                <input type="url" id="eventButtonUrl" placeholder="https://vk.me/... или https://..." required>

                <p class="form-hint" id="formError" role="alert"></p>
                <button type="submit" class="submit-btn" id="formSubmitBtn">Сохранить</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="js/jsonbox.js"></script>
    <script src="js/vk-auth.js"></script>
    <script src="js/export-png.js"></script>
    <script src="js/level-colors.js"></script>
    <script src="js/calendar-view.js"></script>
    <script src="js/event-schedule.js"></script>
    <script src="script.js"></script>
</body>
</html>
