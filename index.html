<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#2669B8">
    <meta name="color-scheme" content="light dark">
    <title>Мероприятия</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@vkontakte/vk-bridge@2/dist/browser.min.js"></script>
    <script src="config.js"></script>
    <script src="js/vk-theme.js"></script>
</head>
<body class="app-shell">
    <div id="mainView">
    <div class="app-header">
        <span id="jsonStorageBadge" class="json-storage-badge hidden" aria-live="polite" title="Оценочный размер данных в JsonBox"></span>
        <h1>Мероприятия</h1>
        <p class="subtitle" id="appSubtitle">Загрузка...</p>
    </div>

    <div class="view-switch" role="tablist" aria-label="Режим просмотра">
        <button type="button" class="view-switch-btn active" data-view="list" role="tab" aria-selected="true">Список</button>
        <button type="button" class="view-switch-btn" data-view="calendar" role="tab" aria-selected="false">Календарь</button>
        <button type="button" class="view-switch-btn" data-view="attended" role="tab" aria-selected="false">Посещённые мероприятия</button>
        <button type="button" class="view-switch-btn hidden" id="usersRegistryViewBtn" data-view="users" role="tab" aria-selected="false">Пользователи</button>
    </div>

    <div class="toolbar">
        <div class="search-wrap">
            <input type="search" id="searchInput" class="search-input" placeholder="Поиск по названию..." autocomplete="off">
            <button type="button" class="search-clear-btn hidden" id="searchClearBtn" aria-label="Очистить поиск">×</button>
        </div>
        <p class="toolbar-summary hidden" id="eventsFilterSummary" aria-live="polite"></p>

        <div class="toolbar-row">
            <div class="filter-menu" id="eventsFilterMenu">
                <button type="button" class="filter-menu__trigger" id="eventsFilterBtn" aria-haspopup="true" aria-expanded="false" aria-controls="eventsFilterDropdown">
                    <span class="filter-menu__icon" aria-hidden="true">⚙</span>
                    <span id="eventsFilterBtnLabel">Фильтры</span>
                    <span class="filter-menu__chevron" aria-hidden="true">▾</span>
                </button>
                <div class="filter-menu__dropdown hidden" id="eventsFilterDropdown" role="menu" aria-label="Фильтры списка">
                    <p class="filter-menu__group-title">Уровень</p>
                    <button type="button" class="filter-menu__item active" role="menuitemradio" data-filter="level" data-value="all" aria-checked="true">Все уровни</button>
                    <button type="button" class="filter-menu__item" role="menuitemradio" data-filter="level" data-value="вузовский" aria-checked="false">Вузовский</button>
                    <button type="button" class="filter-menu__item" role="menuitemradio" data-filter="level" data-value="городской" aria-checked="false">Городской</button>
                    <button type="button" class="filter-menu__item" role="menuitemradio" data-filter="level" data-value="региональный" aria-checked="false">Региональный</button>
                    <button type="button" class="filter-menu__item" role="menuitemradio" data-filter="level" data-value="межрегиональный" aria-checked="false">Межрегиональный</button>
                    <button type="button" class="filter-menu__item" role="menuitemradio" data-filter="level" data-value="всероссийский" aria-checked="false">Всероссийский</button>
                    <button type="button" class="filter-menu__item" role="menuitemradio" data-filter="level" data-value="международный" aria-checked="false">Международный</button>
                    <div class="filter-menu__divider" role="separator"></div>
                    <button type="button" class="filter-menu__item" role="menuitemcheckbox" data-filter="favorites" aria-checked="false">Избранное</button>
                    <button type="button" class="filter-menu__item hidden" role="menuitemcheckbox" data-filter="past" id="pastEventsFilterOption" aria-checked="false">Прошедшие мероприятия</button>
                    <button type="button" class="filter-menu__item filter-menu__item--reset" role="menuitem" data-filter="reset">Сбросить фильтры</button>
                </div>
            </div>
            <button type="button" class="toggle-btn hidden" id="adminPreviewToggleBtn" aria-pressed="false">Как пользователь</button>
        </div>
    </div>

    <div id="adminToolbar" class="admin-toolbar hidden">
        <button type="button" class="add-event-btn" id="addEventBtn">Добавить мероприятие</button>
        <button type="button" class="secondary-btn hidden" id="downloadBackupBtn">Скачать JSON</button>
        <button type="button" class="secondary-btn hidden" id="exportEnrollmentsCsvBtn">Экспорт заявок CSV</button>
        <button type="button" class="delete-past-btn hidden" id="deleteAllPastBtn">Удалить все прошедшие мероприятия</button>
    </div>

    <div id="listView">
        <div id="eventsContainer" class="events-list">
            <div class="loading">Загрузка мероприятий...</div>
        </div>
    </div>

    <div id="calendarView" class="calendar-view hidden" aria-hidden="true">
        <div id="calendarContainer">
            <div class="loading">Загрузка календаря...</div>
        </div>
    </div>

    <div id="attendedView" class="hidden" aria-hidden="true">
        <div id="attendedContainer" class="events-list">
            <div class="loading">Загрузка ваших записей...</div>
        </div>
    </div>

    <div id="usersView" class="hidden" aria-hidden="true">
        <div id="usersContainer" class="events-list">
            <div class="loading">Загрузка пользователей...</div>
        </div>
    </div>
    </div>

    <div id="scheduleView" class="hidden schedule-page-view">
        <div class="schedule-page__top">
            <button type="button" class="schedule-back-btn" id="scheduleBackLink">← К мероприятиям</button>
            <span id="jsonStorageBadgeSchedule" class="json-storage-badge json-storage-badge--schedule hidden" aria-live="polite" title="Оценочный размер данных в JsonBox"></span>
            <button type="button" class="toggle-btn hidden" id="scheduleAdminPreviewToggleBtn" aria-pressed="false">Как пользователь</button>
        </div>

        <div class="schedule-page-content">
            <header class="schedule-page__header">
                <h1 id="schedulePageTitle">Расписание</h1>
                <p id="schedulePageSubtitle" class="schedule-page__subtitle"></p>
            </header>

            <div class="schedule-tabs" role="tablist" aria-label="Разделы расписания">
                <button type="button" class="schedule-tab active" data-tab="regulations" role="tab" aria-selected="true">Регламент мероприятия</button>
                <button type="button" class="schedule-tab" data-tab="volunteer" role="tab" aria-selected="false">Волонтерская смена</button>
                <button type="button" class="schedule-tab hidden" data-tab="participants" role="tab" aria-selected="false">Участники</button>
            </div>

            <div id="schedulePanel" class="schedule-panel"></div>

            <div id="scheduleAdminBar" class="schedule-admin-bar hidden">
                <button type="button" class="secondary-btn" id="scheduleSaveBtn">Сохранить</button>
                <button type="button" class="submit-btn" id="schedulePublishBtn">Опубликовать расписание</button>
            </div>
        </div>
    </div>

    <div id="eventViewModal" class="modal" aria-hidden="true">
        <div class="modal-content event-view-modal">
            <button type="button" class="close" id="eventViewClose" aria-label="Закрыть">&times;</button>
            <div id="eventViewBody"></div>
        </div>
    </div>

    <div id="eventModal" class="modal" aria-hidden="true">
        <div class="modal-content">
            <button type="button" class="close" id="modalClose" aria-label="Закрыть">&times;</button>
            <h2 id="modalTitle">Новое мероприятие</h2>
            <form id="eventForm">
                <input type="hidden" id="eventId">
                <label class="field-label">Название события *</label>
                <input type="text" id="eventTitle" required maxlength="200">

                <label class="field-label">Даты и время проведения *</label>
                <div id="schedulesList" class="schedules-list"></div>
                <button type="button" class="schedules-add-btn" id="addScheduleBtn">+ Добавить дату</button>
                <p class="field-hint">Можно указать несколько дней. Если все даты прошли, карточка видна только в «Прошедшие мероприятия».</p>

                <label class="field-label">Локация</label>
                <input type="text" id="eventLocation" value="ЮРГПУ(НПИ)" maxlength="200">

                <label class="field-label">Уровень *</label>
                <select id="eventLevel" required>
                    <option value="вузовский">Вузовский</option>
                    <option value="городской">Городской</option>
                    <option value="региональный" selected>Региональный</option>
                    <option value="межрегиональный">Межрегиональный</option>
                    <option value="всероссийский">Всероссийский</option>
                    <option value="международный">Международный</option>
                </select>

                <label class="field-label">Набор участников *</label>
                <select id="eventEnrollment" required>
                    <option value="open" selected>Набор открыт</option>
                    <option value="closed">Набор закрыт</option>
                </select>

                <label class="field-label">Функционал</label>
                <textarea id="eventFunctionality" rows="3" placeholder="Задачи и роли участников"></textarea>

                <label class="field-label">Условия</label>
                <textarea id="eventConditions" rows="2" placeholder="Условия участия"></textarea>

                <label class="field-label">Краткое описание</label>
                <textarea id="eventDescription" rows="3" placeholder="Кратко о мероприятии"></textarea>

                <label class="field-label">Текст кнопки</label>
                <input type="text" id="eventButtonLabel" value="Подтвердить участие (перейти в информационный чат)" maxlength="100">

                <label class="field-label">Ссылка или чат VK *</label>
                <input type="url" id="eventButtonUrl" placeholder="https://vk.me/... или https://..." required>

                <p class="form-hint" id="formError" role="alert"></p>
                <button type="submit" class="submit-btn" id="formSubmitBtn">Сохранить</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <!-- Порядок важен: utils/format → jsonbox/vk → модули UI → script.js -->
    <script src="js/utils.js"></script>
    <script src="js/format.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/app-data.js"></script>
    <script src="js/event-form-draft.js"></script>
    <script src="js/jsonbox.js"></script>
    <script src="js/vk-auth.js"></script>
    <script src="js/export-png.js"></script>
    <script src="js/schedule-export.js"></script>
    <script src="js/level-colors.js"></script>
    <script src="js/calendar-view.js"></script>
    <script src="js/event-schedule.js"></script>
    <script src="js/schedule-page.js"></script>
    <script src="script.js"></script>
</body>
</html>
